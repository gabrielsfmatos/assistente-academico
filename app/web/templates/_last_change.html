<footer class="last-change {{ 'hidden' if not last_change }}" id="last-change" {% if oob %}hx-swap-oob="true"{% endif %}>
  {% if last_change %}
    <p>
      Última alteração, {{ 'pelo agente' if last_change.source == 'agente' else 'pelo site' if last_change.source == 'site' else 'pelo sistema' }}:
      <strong>{{ last_change.description }}</strong>
    </p>
    <form method="post" action="/desfazer">
      <button type="submit" class="undo">Desfazer</button>
    </form>
  {% endif %}
</footer>
