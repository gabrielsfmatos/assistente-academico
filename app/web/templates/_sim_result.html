{% if error %}
  <p class="flash flash-erro">{{ error }}</p>
{% elif complete and filled %}
  <div class="sim-out">
    <div>
      <span class="sim-label">CR acumulado</span>
      <strong>{{ total.cr | br }}</strong>
      {% if current is not none and total.cr is not none %}
        {% set diff = total.cr - current %}
        <span class="sim-diff {{ 'down' if diff < 0 }}">{{ '+' if diff >= 0 }}{{ diff | br }}</span>
      {% endif %}
    </div>
    <div>
      <span class="sim-label">CR do período</span>
      <strong>{{ term.cr | br }}</strong>
    </div>
  </div>
{% endif %}
